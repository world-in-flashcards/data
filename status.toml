# How complete each country's note data is, per field group.
#
# `todo` is the default and is never written here. `imported` means the cells came
# from another deck and nobody has checked them. `checked` means a person reviewed
# the group and considers it finished. `n-a` means the group does not apply.
#
# `geo-deck --coverage` cross-checks this against the actual file and exits non-zero
# when a group is declared finished while cells are still undecided. Mark a cell that
# should stay empty with '-' rather than leaving it blank; that is the whole
# difference between done and not started.

