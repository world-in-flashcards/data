# 2026-09-16: the six province cards were replaced by the 24 current regions, so what was
# declared here no longer describes the same rows. `names`, `capital` and `language` are complete
# for the 24, adjudicated that day from English and Malagasy Wikipedia's region tables and
# Overture's capital divisions (every cell's sources are in `#why`) - still `imported` rather than
# `checked` because no person has reviewed them. `status` was filled the same day by
# `geo-deck --fill-status` from the Wikidata pull on the new codes: all 24 read
# `region of Madagascar`, the only compound value P31 offers.
# `ipa` is the one group that is not complete and cannot be from any mirrored source:
# `capitalIPA` is 14 of 24, every one English Wikipedia's `{{IPA|mg|...}}` in the lead of the
# capital's own article, and `placeIPA` is 0 of 24 - not one region article, in English or in
# Malagasy, carries a pronunciation, and Wikidata's P898 is empty for all 24 region items and all
# 24 capital items (measured 2026-09-16 with `src.pronunciation --pull --only`). The ten capitals
# with none are Miarinarivo, Fianarantsoa, Farafangana, Mananjary, Manakara, Fenoarivo Atsinanana,
# Antsohihy, Maevatanana, Maintirano and Tolanaro.
